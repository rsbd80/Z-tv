<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MPlextv</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
    --bg-dark: #0a0a0f;
    --bg-panel: #12121a;
    --bg-card: #1a1a25;
    --bg-hover: #252535;
    --primary: #00ff88;
    --secondary: #00d4ff;
    --accent: #ff00ff;
    --gold: #ffd700;
    --text-main: #ffffff;
    --text-muted: #777788;
    --danger: #ff4757;
    --success: #00ff88;
    --warning: #ffaa00;
    --radius: 12px;
    --radius-sm: 8px;
    --glow: 0 0 30px rgba(0, 255, 136, 0.3);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
    --bg-dark: #f0f2f5;
    --bg-panel: #ffffff;
    --bg-card: #f8f9fa;
    --bg-hover: #e9ecef;
    --text-main: #1a1a2e;
    --text-muted: #666677;
}

* { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent;
    scrollbar-width: thin;
    scrollbar-color: var(--primary) var(--bg-panel);
}

*::-webkit-scrollbar { width: 4px; height: 4px; }
*::-webkit-scrollbar-track { background: var(--bg-panel); }
*::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
}

body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: var(--transition);
}

/* === LOADING SCREEN === */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.6s ease, visibility 0.6s;
}

.loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
}

.loader-container {
    position: relative;
    width: 120px;
    height: 120px;
}

.tv-loader {
    width: 100%;
    height: 100%;
    position: relative;
}

.tv-frame {
    width: 100px;
    height: 70px;
    background: linear-gradient(145deg, #2a2a3a, #1a1a25);
    border-radius: 8px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 
        0 0 0 4px #333,
        0 0 0 6px #222,
        0 20px 40px rgba(0,0,0,0.5);
    overflow: hidden;
}

.tv-screen {
    position: absolute;
    inset: 6px;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
}

.tv-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.1),
        rgba(0, 0, 0, 0.1) 1px,
        transparent 1px,
        transparent 2px
    );
    pointer-events: none;
    z-index: 2;
}

.color-bars {
    display: flex;
    height: 100%;
    animation: staticNoise 0.5s steps(5) infinite;
}

.color-bars div {
    flex: 1;
    animation: colorShift 2s infinite;
}

.color-bars div:nth-child(1) { background: #fff; animation-delay: 0s; }
.color-bars div:nth-child(2) { background: #ffff00; animation-delay: 0.1s; }
.color-bars div:nth-child(3) { background: #00ffff; animation-delay: 0.2s; }
.color-bars div:nth-child(4) { background: #00ff00; animation-delay: 0.3s; }
.color-bars div:nth-child(5) { background: #ff00ff; animation-delay: 0.4s; }
.color-bars div:nth-child(6) { background: #ff0000; animation-delay: 0.5s; }
.color-bars div:nth-child(7) { background: #0000ff; animation-delay: 0.6s; }

@keyframes colorShift {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

@keyframes staticNoise {
    0% { transform: translateX(0); }
    100% { transform: translateX(-5px); }
}

.tv-stand {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 8px;
    background: linear-gradient(145deg, #333, #222);
    border-radius: 0 0 4px 4px;
}

.glow-ring {
    position: absolute;
    inset: -10px;
    border: 3px solid transparent;
    border-radius: 50%;
    border-top-color: var(--primary);
    border-right-color: var(--secondary);
    animation: spinGlow 1.5s linear infinite;
}

.glow-ring::before {
    content: "";
    position: absolute;
    inset: -3px;
    border: 3px solid transparent;
    border-radius: 50%;
    border-bottom-color: var(--accent);
    border-left-color: var(--gold);
    animation: spinGlow 2s linear infinite reverse;
}

@keyframes spinGlow {
    to { transform: rotate(360deg); }
}

.loader-text {
    margin-top: 30px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.loader-text span {
    display: inline-block;
    animation: bounce 1.4s infinite;
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.loader-text span:nth-child(1) { animation-delay: 0s; }
.loader-text span:nth-child(2) { animation-delay: 0.1s; }
.loader-text span:nth-child(3) { animation-delay: 0.2s; }
.loader-text span:nth-child(4) { animation-delay: 0.3s; }
.loader-text span:nth-child(5) { animation-delay: 0.4s; }
.loader-text span:nth-child(6) { animation-delay: 0.5s; }
.loader-text span:nth-child(7) { animation-delay: 0.6s; }

@keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
}

.loader-progress {
    width: 200px;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    margin-top: 20px;
    overflow: hidden;
}

.loader-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    width: 0%;
    transition: width 0.3s;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* === TOAST NOTIFICATIONS === */
.toast-container {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    background: var(--bg-panel);
    border: 1px solid var(--primary);
    padding: 10px 15px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
    box-shadow: var(--glow);
    max-width: 280px;
    font-size: 13px;
}

.toast.error { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }

.toast i { font-size: 16px; }
.toast.success i { color: var(--success); }
.toast.error i { color: var(--danger); }
.toast.warning i { color: var(--warning); }

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

@keyframes fadeOut {
    to { opacity: 0; transform: translateX(100%); }
}

/* === MAIN APP LAYOUT === */
.app-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* === HEADER === */
.top-header {
    background: linear-gradient(135deg, var(--bg-panel) 0%, rgba(0,255,136,0.05) 100%);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 8px;
}

.logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: var(--glow);
    color: #000;
}

.logo-text {
    font-size: 1rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
}

.header-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-size: 12px;
}

.header-btn:hover {
    background: var(--bg-hover);
    border-color: var(--primary);
}

.header-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #000;
}

.connection-status {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px;
    border-radius: 12px;
    background: rgba(0,255,136,0.1);
    font-size: 10px;
    font-weight: 600;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    animation: blink 2s infinite;
}

.status-dot.offline { background: var(--danger); animation: none; }

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

/* === PLAYER SECTION (STICKY) === */
.player-section {
    flex-shrink: 0;
    background: #000;
    position: relative;
}

.player-wrapper {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    background: #000;
}

.video-container {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
}

#videoPlayer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: pointer;
}

/* Player Overlay - Hidden when clicked */
.player-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 40%, rgba(0,0,0,0.9));
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
}

.player-wrapper:hover .player-overlay,
.player-wrapper.controls-visible .player-overlay {
    opacity: 1;
    pointer-events: auto;
}

.player-wrapper.hide-overlay .player-overlay {
    opacity: 0 !important;
    pointer-events: none !important;
}

.now-playing {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.now-playing-logo {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    object-fit: contain;
    background: #222;
}

.now-playing-info h3 {
    margin: 0 0 2px 0;
    font-size: 13px;
}

.now-playing-info span {
    color: var(--text-muted);
    font-size: 10px;
}

.live-badge {
    background: var(--danger);
    color: white;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: bold;
    animation: pulse 2s infinite;
    margin-left: auto;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
}

/* Custom Controls */
.custom-controls {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.ctrl-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-size: 12px;
}

.ctrl-btn:hover {
    background: var(--primary);
    color: #000;
}

.ctrl-btn.active { background: var(--primary); color: #000; }

.volume-wrapper {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 80px;
}

.volume-slider {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    outline: none;
}

.volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
}

.time-display {
    font-size: 10px;
    color: var(--text-muted);
    font-family: monospace;
}

/* Stats Overlay */
.stats-overlay {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.85);
    padding: 8px;
    border-radius: var(--radius-sm);
    font-family: monospace;
    font-size: 9px;
    display: none;
    z-index: 10;
}

.stats-overlay.visible { display: block; }

.stats-overlay div {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 2px;
}

.stats-overlay span:first-child { color: var(--text-muted); }
.stats-overlay span:last-child { color: var(--primary); }

/* Quality Badge */
.quality-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: linear-gradient(135deg, var(--gold), #ff8c00);
    color: #000;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: bold;
}

/* === PLAYER LOADING ANIMATION === */
.player-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    z-index: 5;
}

.player-state.hidden { display: none; }

/* Enhanced Loading Animation */
.loading-spinner {
    position: relative;
    width: 60px;
    height: 60px;
}

.loading-spinner .circle {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 3px solid transparent;
    border-radius: 50%;
}

.loading-spinner .circle:nth-child(1) {
    border-top-color: var(--primary);
    animation: spin3d 1.5s linear infinite;
}

.loading-spinner .circle:nth-child(2) {
    border-right-color: var(--secondary);
    animation: spin3d 1.5s linear infinite 0.2s;
}

.loading-spinner .circle:nth-child(3) {
    border-bottom-color: var(--accent);
    animation: spin3d 1.5s linear infinite 0.4s;
}

.loading-spinner .circle:nth-child(4) {
    width: 40px;
    height: 40px;
    top: 10px;
    left: 10px;
    border-left-color: var(--gold);
    animation: spin3d 1s linear infinite reverse;
}

@keyframes spin3d {
    0% { transform: rotate(0deg) rotateX(30deg); }
    100% { transform: rotate(360deg) rotateX(30deg); }
}

.loading-dots {
    display: flex;
    gap: 6px;
    margin-top: 20px;
}

.loading-dots span {
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    animation: dotPulse 1.4s infinite;
}

.loading-dots span:nth-child(1) { animation-delay: 0s; }
.loading-dots span:nth-child(2) { animation-delay: 0.2s; background: var(--secondary); }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; background: var(--accent); }

@keyframes dotPulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
}

.player-state p { 
    margin: 15px 0 0 0; 
    color: var(--text-muted);
    text-align: center;
    font-size: 12px;
}

.player-state.error .big-icon { 
    font-size: 40px;
    color: var(--danger); 
    margin-bottom: 10px;
}

.retry-btn {
    margin-top: 12px;
    padding: 8px 20px;
    background: var(--primary);
    color: #000;
    border: none;
    border-radius: var(--radius-sm);
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
}

/* Idle state */
.player-state.idle-state {
    background: linear-gradient(135deg, rgba(10,10,15,0.95), rgba(26,26,46,0.95));
}

.idle-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: #000;
    animation: floatIcon 3s ease-in-out infinite;
    box-shadow: 0 0 40px rgba(0,255,136,0.3);
}

@keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* === CHANNELS SECTION (SCROLLABLE) === */
.channels-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-panel);
}

/* Tabs */
.tabs {
    display: flex;
    padding: 8px;
    gap: 5px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
    overflow-x: auto;
}

.tab {
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 1px solid transparent;
    color: var(--text-muted);
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
}

.tab:hover { background: var(--bg-hover); color: var(--text-main); }
.tab.active {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #000;
}

.tab .count {
    background: rgba(0,0,0,0.3);
    padding: 1px 5px;
    border-radius: 6px;
    font-size: 9px;
}

/* Search & Filters */
.filters-section {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
}

.search-wrapper {
    position: relative;
}

.search-wrapper i {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 12px;
}

.search-input {
    width: 100%;
    padding: 8px 10px 8px 32px;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 2px solid transparent;
    color: var(--text-main);
    font-size: 12px;
    outline: none;
    transition: var(--transition);
}

.search-input:focus {
    border-color: var(--primary);
}

.search-input::placeholder { color: var(--text-muted); }

.filter-row {
    display: flex;
    gap: 5px;
}

.filter-select {
    flex: 1;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    font-size: 11px;
    outline: none;
    cursor: pointer;
}

.filter-select:focus { border-color: var(--primary); }

.view-toggle {
    display: flex;
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    overflow: hidden;
}

.view-btn {
    padding: 6px 10px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition);
    font-size: 11px;
}

.view-btn.active {
    background: var(--primary);
    color: #000;
}

/* Channels List - SCROLLABLE */
.channels-container {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.channels-grid {
    display: grid;
    gap: 8px;
}

.channels-grid.grid-view {
    grid-template-columns: repeat(3, 1fr);
}

.channels-grid.list-view {
    grid-template-columns: 1fr;
}

@media (min-width: 400px) {
    .channels-grid.grid-view {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (min-width: 600px) {
    .channels-grid.grid-view {
        grid-template-columns: repeat(5, 1fr);
    }
}

@media (min-width: 800px) {
    .channels-grid.grid-view {
        grid-template-columns: repeat(6, 1fr);
    }
}

/* === CHANNEL CARD === */
.channel-card {
    background: linear-gradient(145deg, var(--bg-card), rgba(30,30,45,0.8));
    border-radius: var(--radius-sm);
    border: 2px solid transparent;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.channel-card:hover {
    transform: translateY(-2px);
    border-color: rgba(0,255,136,0.3);
    box-shadow: 0 5px 20px rgba(0,0,0,0.4);
}

.channel-card.active {
    border-color: var(--primary);
    background: linear-gradient(145deg, rgba(0,255,136,0.15), var(--bg-card));
}

.channel-card.playing {
    animation: playingGlow 2s infinite;
}

@keyframes playingGlow {
    0%, 100% { box-shadow: 0 0 10px rgba(0,255,136,0.3); }
    50% { box-shadow: 0 0 20px rgba(0,255,136,0.5); }
}

/* Grid View Card */
.grid-view .channel-card {
    padding: 8px;
    text-align: center;
}

.grid-view .channel-logo-wrapper {
    width: 100%;
    height: 40px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.grid-view .channel-logo {
    max-width: 100%;
    max-height: 40px;

<script>
// ===== CONFIGURATION =====
const FANCODE_URL = "https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u";

const SOURCES = [
    { url: FANCODE_URL, priority: 1, isLive: true },
    { url: "https://raw.githubusercontent.com/sm-monirulislam/Tapmad_Auto_Update_Playlist/refs/heads/main/tapmad_sm.m3u", priority: 1 },
    { url: "https://raw.githubusercontent.com/sm-monirulislam/jago_bd_auto_update_playlist-/refs/heads/main/jago_bd_main.m3u", priority: 3 },
    { url: "https://raw.githubusercontent.com/sm-monirulislam/AynaOTT_Auto_Update_Playlist/refs/heads/main/aynaott.m3u", priority: 2 }
];

const TEAM_PATTERNS = {
    'CSK': { name: 'CSK', type: 'ipl', icon: 'fa-cricket-bat-ball' },
    'MI': { name: 'MI', type: 'ipl', icon: 'fa-cricket-bat-ball' },
    'RCB': { name: 'RCB', type: 'ipl', icon: 'fa-cricket-bat-ball' },
    'KKR': { name: 'KKR', type: 'ipl', icon: 'fa-cricket-bat-ball' },
    'DC': { name: 'DC', type: 'ipl', icon: 'fa-cricket-bat-ball' },
    'SRH': { name: 'SRH', type: 'ipl', icon: 'fa-cricket-bat-ball' },
    'PBKS': { name: 'PBKS', type: 'ipl', icon: 'fa-cricket-bat-ball' },
    'RR': { name: 'RR', type: 'ipl', icon: 'fa-cricket-bat-ball' },
    'GT': { name: 'GT', type: 'ipl', icon: 'fa-cricket-bat-ball' },
    'LSG': { name: 'LSG', type: 'ipl', icon: 'fa-cricket-bat-ball' },
    'IPL': { name: 'IPL', type: 'ipl', icon: 'fa-trophy' },
    'IND': { name: 'IND', type: 'cricket', icon: 'fa-flag' },
    'INDIA': { name: 'IND', type: 'cricket', icon: 'fa-flag' },
    'PAK': { name: 'PAK', type: 'cricket', icon: 'fa-flag' },
    'AUS': { name: 'AUS', type: 'cricket', icon: 'fa-flag' },
    'ENG': { name: 'ENG', type: 'cricket', icon: 'fa-flag' },
    'SA': { name: 'SA', type: 'cricket', icon: 'fa-flag' },
    'NZ': { name: 'NZ', type: 'cricket', icon: 'fa-flag' },
    'T20': { name: 'T20', type: 'cricket', icon: 'fa-cricket-bat-ball' },
    'ODI': { name: 'ODI', type: 'cricket', icon: 'fa-cricket-bat-ball' },
    'WORLD CUP': { name: 'WC', type: 'wc', icon: 'fa-trophy' },
    'WC': { name: 'WC', type: 'wc', icon: 'fa-trophy' },
    'EPL': { name: 'EPL', type: 'football', icon: 'fa-futbol' },
    'UCL': { name: 'UCL', type: 'football', icon: 'fa-trophy' },
    'FIFA': { name: 'FIFA', type: 'football', icon: 'fa-futbol' },
};

const STORAGE_KEYS = {
    favorites: 'iptv_favorites',
    history: 'iptv_history',
    volume: 'iptv_volume',
    theme: 'iptv_theme'
};

// ===== STATE =====
let allChannels = [];
let filteredChannels = [];
let favorites = new Set(JSON.parse(localStorage.getItem(STORAGE_KEYS.favorites) || '[]'));
let history = JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || '[]');
let currentChannel = null;
let currentIndex = -1;
let hls = null;
let controlsTimeout = null;
let statsInterval = null;
let playStartTime = null;
let loadProgress = 0;
let autoPlayAttempt = 0;
let isOverlayHidden = false;

// ===== ELEMENTS =====
const video = document.getElementById('videoPlayer');
const playerWrapper = document.getElementById('playerWrapper');
const videoContainer = document.getElementById('videoContainer');
const channelsGrid = document.getElementById('channelsGrid');
const searchInput = document.getElementById('searchInput');
const groupFilter = document.getElementById('groupFilter');
const sortFilter = document.getElementById('sortFilter');

// ===== INITIALIZATION =====
document.addEventListener('DOMContentLoaded', async () => {
    initTheme();
    initEventListeners();
    await loadAllPlaylists();
    hideLoading();
    autoPlayFirstChannel();
});

function initTheme() {
    const savedTheme = localStorage.getItem(STORAGE_KEYS.theme) || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);
}

function initEventListeners() {
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('shortcutsBtn').addEventListener('click', () => toggleModal('shortcutsModal'));
    
    document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
    document.getElementById('muteBtn').addEventListener('click', toggleMute);
    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
    document.getElementById('statsBtn').addEventListener('click', toggleStats);
    document.getElementById('prevBtn').addEventListener('click', playPrevious);
    document.getElementById('nextBtn').addEventListener('click', playNext);
    
    // Click on video to toggle overlay
    video.addEventListener('click', toggleOverlayHide);
    videoContainer.addEventListener('click', (e) => {
        if (e.target === videoContainer) toggleOverlayHide();
    });
    
    const volumeSlider = document.getElementById('volumeSlider');
    volumeSlider.value = localStorage.getItem(STORAGE_KEYS.volume) || 80;
    video.volume = volumeSlider.value / 100;
    volumeSlider.addEventListener('input', (e) => {
        video.volume = e.target.value / 100;
        localStorage.setItem(STORAGE_KEYS.volume, e.target.value);
        updateVolumeIcon();
    });
    
    video.addEventListener('play', () => {
        document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-pause"></i>';
        playStartTime = Date.now();
    });
    video.addEventListener('pause', () => {
        document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
    });
    video.addEventListener('timeupdate', updateTimeDisplay);
    video.addEventListener('waiting', () => showPlayerState('loading'));
    video.addEventListener('playing', () => hidePlayerStates());
    
    playerWrapper.addEventListener('mousemove', showControls);
    playerWrapper.addEventListener('mouseleave', hideControls);
    playerWrapper.addEventListener('touchstart', handleTouch);
    
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });
    
    document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
    });
    
    searchInput.addEventListener('input', debounce(applyFilters, 300));
    groupFilter.addEventListener('change', applyFilters);
    sortFilter.addEventListener('change', applyFilters);
    
    document.addEventListener('keydown', handleKeyboard);
    
    document.querySelectorAll('.modal-overlay').forEach(modal => {
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('visible');
        });
    });
    
    window.addEventListener('online', () => updateConnectionStatus(true));
    window.addEventListener('offline', () => updateConnectionStatus(false));
}

// ===== TOGGLE OVERLAY HIDE =====
function toggleOverlayHide() {
    isOverlayHidden = !isOverlayHidden;
    if (isOverlayHidden) {
        playerWrapper.classList.add('hide-overlay');
    } else {
        playerWrapper.classList.remove('hide-overlay');
        showControls();
    }
}

function handleTouch(e) {
    if (isOverlayHidden) {
        e.preventDefault();
        toggleOverlayHide();
    } else {
        showControls();
    }
}

// ===== AUTO PLAY FIRST CHANNEL =====
function autoPlayFirstChannel() {
    if (allChannels.length === 0) {
        showToast('No channels available', 'error');
        return;
    }
    
    autoPlayAttempt = 0;
    tryAutoPlay(0);
}

function tryAutoPlay(index) {
    if (index >= allChannels.length) {
        showToast('All channels failed to load', 'error');
        showPlayerState('error');
        document.getElementById('errorMessage').textContent = 'No working channels found';
        return;
    }
    
    autoPlayAttempt = index;
    const channel = allChannels[index];
    
    currentChannel = channel;
    currentIndex = index;
    
    document.getElementById('nowPlayingLogo').src = channel.logo;
    document.getElementById('nowPlayingName').textContent = channel.name;
    
    let metaText = '';
    if (channel.isFancode && channel.teams && channel.teams.length > 0) {
        metaText = channel.teams.map(t => t.name).join(' vs ');
    }
    document.getElementById('nowPlayingMeta').textContent = metaText;
    
    showPlayerState('loading');
    loadStreamWithFallback(channel.url, index);
}

function loadStreamWithFallback(url, index) {
    if (hls) {
        hls.destroy();
        hls = null;
    }
    
    let hasStarted = false;
    let errorTimeout;
    
    // Set timeout for stream to start
    errorTimeout = setTimeout(() => {
        if (!hasStarted) {
            console.log(`Channel ${index + 1} timeout, trying next...`);
            tryAutoPlay(index + 1);
        }
    }, 8000); // 8 second timeout
    
    if (url.includes('.m3u8') || url.includes('m3u8')) {
        if (Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90
            });
            
            hls.loadSource(url);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                hasStarted = true;
                clearTimeout(errorTimeout);
                video.play().catch(e => console.log('Autoplay blocked'));
                hidePlayerStates();
                updateQualityBadge();
                updateChannelUI();
                showToast(`Playing: ${currentChannel.name}`, 'success');
            });
            
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    clearTimeout(errorTimeout);
                    console.log(`Channel ${index + 1} error, trying next...`);
                    tryAutoPlay(index + 1);
                }
            });
            
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadeddata', () => {
                hasStarted = true;
                clearTimeout(errorTimeout);
                video.play();
                hidePlayerStates();
                updateChannelUI();
            }, { once: true });
            
            video.addEventListener('error', () => {
                clearTimeout(errorTimeout);
                tryAutoPlay(index + 1);
            }, { once: true });
        }
    } else {
        video.src = url;
        video.addEventListener('loadeddata', () => {
            hasStarted = true;
            clearTimeout(errorTimeout);
            video.play();
            hidePlayerStates();
            updateChannelUI();
        }, { once: true });
        
        video.addEventListener('error', () => {
            clearTimeout(errorTimeout);
            tryAutoPlay(index + 1);
        }, { once: true });
    }
}

function updateChannelUI() {
    document.querySelectorAll('.channel-card').forEach(card => {
        card.classList.remove('active', 'playing');
    });
    
    if (currentChannel) {
        const activeCard = document.querySelector(`[data-id="${currentChannel.id}"]`);
        if (activeCard) {
            activeCard.classList.add('active', 'playing');
        }
        addToHistory(currentChannel);
    }
}

// ===== DATA LOADING =====
async function loadAllPlaylists() {
    const totalSources = SOURCES.length;
    let loadedSources = 0;
    
    const promises = SOURCES.map(source =>
        fetch(source.url)
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.text();
            })
            .then(text => {
                parseM3U(text, source.priority, source.isLive || false, source.url);
                loadedSources++;
                updateLoadProgress((loadedSources / totalSources) * 100);
            })
            .catch(err => {
                console.error('Failed to load:', source.url, err);
                loadedSources++;
                updateLoadProgress((loadedSources / totalSources) * 100);
            })
    );
    
    await Promise.all(promises);
    
    allChannels.sort((a, b) => {
        if (a.priority !== b.priority) return a.priority - b.priority;
        return a.name.localeCompare(b.name);
    });
    
    filteredChannels = [...allChannels];
    updateGroups();
    renderChannels();
    updateCounts();
}

function updateLoadProgress(percent) {
    loadProgress = percent;
    document.getElementById('loaderProgress').style.width = percent + '%';
}

function parseM3U(data, priority, isLiveSource, sourceUrl) {
    const lines = data.split(/\r?\n/);
    let channel = {};
    const isFancode = sourceUrl === FANCODE_URL;
    
    lines.forEach(line => {
        line = line.trim();
        
        if (line.startsWith('#EXTINF:')) {
            channel = { 
                priority, 
                id: generateId(),
                isLive: isLiveSource || isFancode,
                isFancode: isFancode
            };
            
            const logoMatch = line.match(/tvg-logo="([^"]*)"/);
            channel.logo = logoMatch ? logoMatch[1] : '';
            
            const groupMatch = line.match(/group-title="([^"]*)"/);
            channel.group = groupMatch ? groupMatch[1] : 'Uncategorized';
            
            channel.name = line.split(',').pop().trim();
            
            if (isFancode) {
                channel.teams = detectTeams(channel.name);
            } else {
                channel.teams = [];
            }
            
        } else if (line && !line.startsWith('#')) {
            channel.url = line;
            
            if (!allChannels.some(c => c.url === channel.url)) {
                if (!channel.logo) {
                    channel.logo = `https://via.placeholder.com/80x50/1a1a2e/ffffff?text=${encodeURIComponent(channel.name.charAt(0))}`;
                }
                allChannels.push(channel);
            }
        }
    });
}

function detectTeams(name) {
    const upperName = name.toUpperCase();
    const detected = [];
    
    const vsMatch = upperName.match(/(\w+)\s*(?:VS|V\/S|V)\s*(\w+)/i);
    if (vsMatch) {
        const team1 = TEAM_PATTERNS[vsMatch[1]];
        const team2 = TEAM_PATTERNS[vsMatch[2]];
        if (team1) detected.push(team1);
        if (team2) detected.push(team2);
    }
    
    for (const [pattern, info] of Object.entries(TEAM_PATTERNS)) {
        if (upperName.includes(pattern) && !detected.some(d => d.name === info.name)) {
            detected.push(info);
            if (detected.length >= 2) break;
        }
    }
    
    return detected;
}

function generateId() {
    return Math.random().toString(36).substr(2, 9);
}

// ===== RENDERING =====
function renderChannels() {
    const grid = channelsGrid;
    grid.innerHTML = '';
    
    if (filteredChannels.length === 0) {
        grid.innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
                <i class="fas fa-search"></i>
                <p>No channels found</p>
            </div>
        `;
        return;
    }
    
    const fragment = document.createDocumentFragment();
    
    filteredChannels.forEach((ch, index) => {
        const card = document.createElement('div');
        card.className = `channel-card priority-${ch.priority} fade-in`;
        if (currentChannel && currentChannel.url === ch.url) {
            card.classList.add('active', 'playing');
        }
        card.dataset.index = index;
        card.dataset.id = ch.id;
        
        const isFav = favorites.has(ch.url);
        
        let badgesHTML = '';
        if (ch.isFancode) {
            badgesHTML = '<span class="badge-live">LIVE</span>';
            if (ch.teams && ch.teams.length > 0) {
                ch.teams.forEach(team => {
                    badgesHTML += `<span class="badge-team badge-${team.type}"><i class="fas ${team.icon}"></i>${team.name}</span>`;
                });
            }
        }
        
        card.innerHTML = `
            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${ch.url}', this)">
                <i class="fas fa-heart"></i>
            </button>
            <div class="priority-indicator"></div>
            <div class="channel-logo-wrapper">
                <img class="channel-logo" src="${ch.logo}" alt="${ch.name}" loading="lazy" 
                     onerror="this.src='https://via.placeholder.com/80x50/1a1a2e/666?text=TV'">
            </div>
            <div class="channel-info">
                <div class="channel-name" title="${ch.name}">${ch.name}</div>
                <div class="channel-badges">${badgesHTML}</div>
            </div>
        `;
        
        card.addEventListener('click', () => playChannel(ch, index));
        fragment.appendChild(card);
    });
    
    grid.appendChild(fragment);
}

function updateGroups() {
    const groups = [...new Set(allChannels.map(c => c.group))].sort();
    groupFilter.innerHTML = '<option value="all">All Groups</option>';
    
    groups.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        groupFilter.appendChild(opt);
    });
}

function updateCounts() {
    document.getElementById('allCount').textContent = allChannels.length;
    document.getElementById('favCount').textContent = favorites.size;
}

// ===== PLAYBACK =====
function playChannel(channel, index) {
    if (currentChannel && currentChannel.url === channel.url) return;
    
    currentChannel = channel;
    currentIndex = index;
    
    document.querySelectorAll('.channel-card').forEach(card => {
        card.classList.remove('active', 'playing');
    });
    
    const activeCard = document.querySelector(`[data-id="${channel.id}"]`);
    if (activeCard) {
        activeCard.classList.add('active', 'playing');
    }
    
    document.getElementById('nowPlayingLogo').src = channel.logo;
    document.getElementById('nowPlayingName').textContent = channel.name;
    
    let metaText = '';
    if (channel.isFancode && channel.teams && channel.teams.length > 0) {
        metaText = channel.teams.map(t => t.name).join(' vs ');
    }
    document.getElementById('nowPlayingMeta').textContent = metaText;
    
    showPlayerState('loading');
    loadStream(channel.url);
    addToHistory(channel);
    
    // Reset overlay hide state
    isOverlayHidden = false;
    playerWrapper.classList.remove('hide-overlay');
    
    showToast(`Playing: ${channel.name}`, 'success');
}

function loadStream(url) {
    if (hls) {
        hls.destroy();
        hls = null;
    }
    
    if (url.includes('.m3u8') || url.includes('m3u8')) {
        if (Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90
            });
            
            hls.loadSource(url);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log('Autoplay blocked'));
                hidePlayerStates();
                updateQualityBadge();
            });
            
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    handleStreamError(data.details);
                }
            });
            
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play().catch(e => console.log('Autoplay blocked'));
        }
    } else {
        video.src = url;
        video.play().catch(e => console.log('Autoplay blocked'));
    }
}

function handleStreamError(details) {
    console.error('Stream error:', details);
    showPlayerState('error');
    document.getElementById('errorMessage').textContent = `Error: ${details}`;
    showToast('Stream failed', 'error');
}

function retryStream() {
    if (currentChannel) {
        showPlayerState('loading');
        setTimeout(() => loadStream(currentChannel.url), 500);
    }
}

function togglePlay() {
    if (video.paused) {
        video.play();
    } else {
        video.pause();
    }
}

function toggleMute() {
    video.muted = !video.muted;
    updateVolumeIcon();
}

function updateVolumeIcon() {
    const icon = document.querySelector('#muteBtn i');
    if (video.muted || video.volume === 0) {
        icon.className = 'fas fa-volume-mute';
    } else if (video.volume < 0.5) {
        icon.className = 'fas fa-volume-down';
    } else {
        icon.className = 'fas fa-volume-up';
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        playerWrapper.requestFullscreen().catch(err => {
            showToast('Fullscreen not available', 'warning');
        });
    } else {
        document.exitFullscreen();
    }
}

function playNext() {
    if (filteredChannels.length === 0) return;
    const nextIndex = (currentIndex + 1) % filteredChannels.length;
    playChannel(filteredChannels[nextIndex], nextIndex);
}

function playPrevious() {
    if (filteredChannels.length === 0) return;
    const prevIndex = currentIndex <= 0 ? filteredChannels.length - 1 : currentIndex - 1;
    playChannel(filteredChannels[prevIndex], prevIndex);
}

// ===== PLAYER STATES =====
function showPlayerState(state) {
    hidePlayerStates();
    const el = document.getElementById(`player${state.charAt(0).toUpperCase() + state.slice(1)}`);
    if (el) el.classList.remove('hidden');
}

function hidePlayerStates() {
    document.querySelectorAll('.player-state').forEach(el => el.classList.add('hidden'));
}

// ===== STATS =====
function toggleStats() {
    const overlay = document.getElementById('statsOverlay');
    overlay.classList.toggle('visible');
    
    if (overlay.classList.contains('visible')) {
        statsInterval = setInterval(updateLiveStats, 1000);
    } else {
        clearInterval(statsInterval);
    }
}

function updateLiveStats() {
    if (!hls) return;
    
    const level = hls.levels[hls.currentLevel];
    if (level) {
        document.getElementById('statRes').textContent = `${level.width}x${level.height}`;
        document.getElementById('statBitrate').textContent = Math.round(level.bitrate / 1000) + ' kbps';
    }
    
    if (video.buffered.length > 0) {
        const buffered = video.buffered.end(video.buffered.length - 1) - video.currentTime;
        document.getElementById('statBuffer').textContent = buffered.toFixed(1) + 's';
    }
}

function updateQualityBadge() {
    if (!hls) return;
    const level = hls.levels[hls.currentLevel];
    if (level) {
        let quality = 'SD';
        if (level.height >= 2160) quality = '4K';
        else if (level.height >= 1080) quality = 'FHD';
        else if (level.height >= 720) quality = 'HD';
        document.getElementById('qualityBadge').textContent = quality;
    }
}

// ===== TIME DISPLAY =====
function updateTimeDisplay() {
    if (!playStartTime) return;
    const elapsed = Math.floor((Date.now() - playStartTime) / 1000);
    const hours = Math.floor(elapsed / 3600);
    const minutes = Math.floor((elapsed % 3600) / 60);
    const seconds = elapsed % 60;
    document.getElementById('timeDisplay').textContent = 
        `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
}

// ===== CONTROLS VISIBILITY =====
function showControls() {
    if (isOverlayHidden) return;
    playerWrapper.classList.add('controls-visible');
    clearTimeout(controlsTimeout);
    controlsTimeout = setTimeout(hideControls, 3000);
}

function hideControls() {
    if (!video.paused && !isOverlayHidden) {
        playerWrapper.classList.remove('controls-visible');
    }
}

// ===== FAVORITES =====
function toggleFavorite(url, btn) {
    if (favorites.has(url)) {
        favorites.delete(url);
        btn.classList.remove('active');
        showToast('Removed from favorites', 'warning');
    } else {
        favorites.add(url);
        btn.classList.add('active');
        showToast('Added to favorites', 'success');
    }
    
    localStorage.setItem(STORAGE_KEYS.favorites, JSON.stringify([...favorites]));
    updateCounts();
}

// ===== HISTORY =====
function addToHistory(channel) {
    history = history.filter(h => h.url !== channel.url);
    history.unshift({ ...channel, watchedAt: Date.now() });
    history = history.slice(0, 20);
    localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(history));
}

// ===== TABS =====
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    
    switch (tab) {
        case 'all':
            filteredChannels = [...allChannels];
            break;
        case 'favorites':
            filteredChannels = allChannels.filter(c => favorites.has(c.url));
            break;
        case 'history':
            filteredChannels = history.filter(h => allChannels.some(c => c.url === h.url));
            break;
    }
    
    applyFilters();
}

// ===== VIEW TOGGLE =====
function switchView(view) {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-view="${view}"]`).classList.add('active');
    channelsGrid.className = `channels-grid ${view}-view`;
}

// ===== FILTERS =====
function applyFilters() {
    const search = searchInput.value.toLowerCase();
    const group = groupFilter.value;
    const sort = sortFilter.value;
    
    const currentTab = document.querySelector('.tab.active').dataset.tab;
    let baseList;
    
    switch (currentTab) {
        case 'favorites':
            baseList = allChannels.filter(c => favorites.has(c.url));
            break;
        case 'history':
            baseList = history.filter(h => allChannels.some(c => c.url === h.url));
            break;
        default:
            baseList = [...allChannels];
    }
    
    let results = baseList.filter(ch => {
        const matchesSearch = ch.name.toLowerCase().includes(search);
        const matchesGroup = group === 'all' || ch.group === group;
        return matchesSearch && matchesGroup;
    });
    
    results.sort((a, b) => {
        switch (sort) {
            case 'name': return a.name.localeCompare(b.name);
            default: return a.priority - b.priority || a.name.localeCompare(b.name);
        }
    });
    
    filteredChannels = results;
    renderChannels();
}

// ===== THEME =====
function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(STORAGE_KEYS.theme, next);
    updateThemeIcon(next);
}

function updateThemeIcon(theme) {
    const icon = document.querySelector('#themeToggle i');
    icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
}

// ===== KEYBOARD SHORTCUTS =====
function handleKeyboard(e) {
    if (e.target.tagName === 'INPUT') return;
    
    switch (e.key.toLowerCase()) {
        case ' ':
            e.preventDefault();
            togglePlay();
            break;
        case 'm':
            toggleMute();
            break;
        case 'f':
            toggleFullscreen();
            break;
        case 'arrowup':
            e.preventDefault();
            video.volume = Math.min(1, video.volume + 0.1);
            document.getElementById('volumeSlider').value = video.volume * 100;
            break;
        case 'arrowdown':
            e.preventDefault();
            video.volume = Math.max(0, video.volume - 0.1);
            document.getElementById('volumeSlider').value = video.volume * 100;
            break;
        case 'n':
            playNext();
            break;
        case 'b':
            playPrevious();
            break;
        case 's':
            toggleStats();
            break;
        case '/':
            e.preventDefault();
            searchInput.focus();
            break;
        case 'escape':
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('visible'));
            if (isOverlayHidden) toggleOverlayHide();
            break;
    }
}

// ===== CONNECTION STATUS =====
function updateConnectionStatus(online) {
    const dot = document.getElementById('connectionDot');
    const text = document.getElementById('connectionText');
    
    if (online) {
        dot.classList.remove('offline');
        text.textContent = 'Online';
    } else {
        dot.classList.add('offline');
        text.textContent = 'Offline';
        showToast('You are offline', 'error');
    }
}

// ===== MODALS =====
function toggleModal(id) {
    document.getElementById(id).classList.toggle('visible');
}

// ===== LOADING =====
function hideLoading() {
    updateLoadProgress(100);
    setTimeout(() => {
        document.getElementById('loadingOverlay').classList.add('hidden');
    }, 600);
}

// ===== TOAST =====
function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    const icons = {
        success: 'fa-check-circle',
        error: 'fa-times-circle',
        warning: 'fa-exclamation-circle'
    };
    
    toast.innerHTML = `
        <i class="fas ${icons[type]}"></i>
        <span>${message}</span>
    `;
    
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// ===== UTILITIES =====
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
    };
}
